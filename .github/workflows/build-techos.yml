name: Build TechOS Core ISO

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly: Sundays 04:00 UTC
    - cron: '0 4 * * 0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache || true
          df -h /

      - name: Build builder image
        run: docker build -t techos-builder .

      - name: Build ISO in container
        run: |
          mkdir -p build
          docker run --rm --privileged \
            -e DEBIAN_FRONTEND=noninteractive \
            -e UBUNTU_MIRROR=${{ vars.UBUNTU_MIRROR || 'http://archive.ubuntu.com/ubuntu' }} \
            -v "$PWD/build:/workspace/build" \
            techos-builder

      - name: Check ISO size
        run: |
          ls -lh build/artifacts/
          SIZE=$(stat -c%s build/artifacts/techos-core-amd64.iso)
          echo "ISO size: $SIZE bytes"
          if [ "$SIZE" -gt 2147483648 ]; then
            echo "::error::ISO exceeds 2.0 GB target"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: techos-core-iso
          path: build/artifacts/
          retention-days: 14

      - name: Create weekly release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: weekly-${{ github.run_number }}
          name: TechOS Core ${{ github.run_number }}
          body: Automated weekly TechOS Core ISO build.
          files: build/artifacts/techos-core-amd64.iso
